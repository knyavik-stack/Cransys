<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Letter C Truss Framework (Пропорционально увеличен) -->
  <g stroke="#003882" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Внешняя большая дуга (Радиус увеличен со 155 до 195) -->
    <path d="M 395 152 A 195 195 0 1 0 395 360" />
    
    <!-- Внутренняя малая дуга (Радиус увеличен с 75 до 95) -->
    <path d="M 315 204 A 95 95 0 1 0 315 308" />
    
    <!-- Верхняя соединительная линия конструкции -->
    <line x1="315" y1="204" x2="395" y2="152" />
    
    <!-- Нижняя соединительная линия конструкции -->
    <line x1="315" y1="308" x2="395" y2="360" />
  </g>

  <!-- Red Vector Arrow (Смещена и увеличена под масштаб) -->
  <polygon points="325,170 403,170 375,198" fill="#DC2626" />
</svg>
