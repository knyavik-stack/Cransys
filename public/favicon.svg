<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Blueprint Grid -->
  <g stroke="#7EA8D3" stroke-width="8" opacity="0.7" stroke-linecap="round">
    <line x1="100" y1="160" x2="430" y2="160" />
    <line x1="100" y1="256" x2="430" y2="256" />
    <line x1="100" y1="352" x2="430" y2="352" />
    
    <line x1="160" y1="100" x2="160" y2="430" />
    <line x1="256" y1="100" x2="256" y2="430" />
    <line x1="352" y1="100" x2="352" y2="430" />
  </g>

  <!-- Medical Monitor Truss Framework -->
  <g stroke="#003882" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Главный контур экрана монитора -->
    <path d="M 120 330 L 120 150 L 400 150 L 400 240" />
    <!-- Нижняя линия экрана, оставляющая место под круг -->
    <line x1="120" y1="330" x2="220" y2="330" />
    
    <!-- Ножка и опорные линии подставки -->
    <line x1="256" y1="330" x2="256" y2="395" />
    <line x1="170" y1="395" x2="310" y2="395" />

    <!-- Линия пульса кардиограммы, выровненная по сетке -->
    <path d="M 150 256 L 190 256 L 210 210 L 235 310 L 256 140 L 280 290 L 295 240 L 315 256 L 340 256" />

    <!-- Круглый значок подтверждения (построен дугами A по вашему образцу) -->
    <path d="M 435 340 A 65 65 0 1 0 305 340 A 65 65 0 1 0 435 340" />
    
    <!-- Галочка строго внутри значка -->
    <path d="M 340 340 L 360 365 L 400 315" />
  </g>

  <!-- Red Vector Arrow -->
  <!-- Переместил красный указатель, чтобы он акцентировал внимание на галочке подтверждения -->
  <polygon points="425,245 448,285 385,267" fill="#DC2626" />
</svg>
