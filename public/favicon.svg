<svg xmlns="http://w3.org" viewBox="0 0 512 512" fill="none">
  <!-- Корпус и подставка монитора -->
  <g stroke="#005ad9" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Рамка экрана (оставляем разрыв внизу справа для значка) -->
    <path d="M 400 240 L 400 150 L 112 150 L 112 330 L 220 330" />
    
    <!-- Ножка монитора (прямые линии) -->
    <path d="M 230 330 L 230 380 M 282 330 L 282 380" />
    
    <!-- Нижнее горизонтальное основание подставки -->
    <line x1="170" y1="395" x2="310" y2="395" />
  </g>

  <!-- Линия пульса (кардиограмма) -->
  <g stroke="#005ad9" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 140 245 L 180 245 L 205 195 L 225 295 L 255 150 L 280 275 L 295 230 L 320 245 L 350 245" />
  </g>

  <!-- Круглый значок (построен как восьмиугольник из прямых линий — без дуг) -->
  <g stroke="#005ad9" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polygon points="345,275 395,275 430,310 430,360 395,395 345,395 310,360 310,310" />
  </g>

  <!-- Подтверждающая галочка внутри значка -->
  <g stroke="#005ad9" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 340 335 L 365 360 L 400 310" />
  </g>
</svg>
