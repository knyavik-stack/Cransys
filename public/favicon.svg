<svg xmlns="http://w3.org" viewBox="0 0 512 512" fill="none">
  <!-- Monitor Framework -->
  <g stroke="#005ad9" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Рамка монитора: левая, верхняя и правая стороны -->
    <path d="M 120 330 L 120 150 L 400 150 L 400 240" />
    <!-- Нижняя часть рамки, которая не пересекается с кругом -->
    <line x1="120" y1="330" x2="220" y2="330" />
    
    <!-- Ножка монитора -->
    <line x1="256" y1="330" x2="256" y2="395" />
    
    <!-- Основание подставки -->
    <line x1="170" y1="395" x2="310" y2="395" />
  </g>

  <!-- Pulse Line Inside Screen -->
  <g stroke="#005ad9" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Линия пульса -->
    <path d="M 155 240 L 190 240 L 210 200 L 235 290 L 260 160 L 285 270 L 300 225 L 320 240 L 350 240" />
  </g>

  <!-- Verification Badge -->
  <g stroke="#005ad9" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Круг-значок (заменен на стандартный circle во избежание ошибок) -->
    <circle cx="370" cy="340" r="65" />
  </g>

  <!-- Red Vector Arrow -->
  <g stroke="#005ad9" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Галочка строго по центру синего круга -->
    <path d="M 340 340 L 360 360 L 400 310" />
  </g>
</svg>
